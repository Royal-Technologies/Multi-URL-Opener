<!DOCTYPE html>
<html lang="en">
<head>
  <title>Multi URL Opener by Royal Technologies</title>
  <meta charset=utf-8>
  <meta content="width=device-width,initial-scale=1" name=viewport>
  <link href=images/favicon.ico rel="shortcut icon" type=image/x-icon>
  <meta content="url opener, multiple url opener, open multiple url, open multiple links, open multiple urls, Open multiple websites" name=keywords>
  <meta content="Free web tool to open multiple URLs or Multiple Links at the same time through the web browser in multiple tabs simultaneously." name=description>
  <script src=scripts/jquery-3.2.0.min.js></script>
  <link href=css/style.css rel=stylesheet>
  </head>
  <body>

  <div class=container id=google_translate_element>
    <h1 class=title>Multi URL Opener</h1>
    <p class=lead>Enter urls, one per <strong>line</strong> or separated by <strong>commas</strong> or separated by <strong>space</strong> in the below text area. It will open all the given URLs in just a click.<p class=blink_me id=message></p>
    <textarea autofocus class=form-control cols=5 id=txtUrls placeholder="Paste/Enter urls separated by commas, new line or space." rows=10 spellcheck=false></textarea>
    <br>
    <div class="input-group btn-toolbar">
      <button id=openUrls title="Press Ctrl+Enter as shortcut" type=button>Open all [Ctrl+Enter]</button>
      <button id=resetUrls title="Press Ctrl+R as shortcut" type=reset>Reset [Ctrl+R]</button>
      <button><a href=https://www.royaltechbd.com target="_blank">Royal Technologies</a></button>
    </div>
    <br>
    
    <div>
    </div>
  </div>

  </body>
</html>
